<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Akan Adaduanan Calendar · Merankron</title>
<style>
@font-face{font-family:"Inter";src:url(fonts/Inter-Regular.woff2) format("woff2");font-weight:400}
@font-face{font-family:"Inter";src:url(fonts/Inter-SemiBold.woff2) format("woff2");font-weight:500 600}
@font-face{font-family:"Inter";src:url(fonts/Inter-Bold.woff2) format("woff2");font-weight:700}
@font-face{font-family:"Inter";src:url(fonts/Inter-ExtraBold.woff2) format("woff2");font-weight:800 900}
:root{--font:"Inter",sans-serif;--label:#000;--label2:#555;--bg:#fff;color-scheme:light}
@page{size:A4;margin:0}
*{box-sizing:border-box;margin:0}
html,body{background:#d9d9d9;color:#000;font:10pt/1.5 var(--font);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pg{width:210mm;height:297mm;margin:10mm auto;background:#fff;position:relative;overflow:hidden;padding:18mm 18mm 16mm;display:flex;flex-direction:column;page-break-after:always;break-after:page}
@media print{html,body{background:#fff}.pg{margin:0}}
.wm{position:absolute;left:50%;top:54%;width:150mm;height:150mm;transform:translate(-50%,-50%);opacity:.05;pointer-events:none}.wm svg{width:100%;height:100%;display:block;fill:#000}
.pg>*:not(.wm){position:relative}
.kr-i{display:inline-block;font-family:var(--kr),sans-serif;font-feature-settings:"liga","calt";line-height:1;white-space:nowrap}
.run{display:flex;justify-content:space-between;font:600 7.5pt var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--label2);margin-bottom:9mm}
.foot{margin-top:auto;display:flex;justify-content:space-between;font:500 7.5pt var(--font);color:var(--label2);padding-top:5mm;border-top:.3mm solid #000}
h2{font:800 22pt/1.05 var(--font);letter-spacing:-.02em}
h3{font:700 10.5pt var(--font);margin:5mm 0 1.5mm}
p{margin-top:2mm}
.lede{font-size:11pt;line-height:1.55;margin-top:4mm}

/* cover */
.cover{background:#000;color:#fff;padding:20mm}
.cover .wm svg{fill:#fff}.cover .wm{opacity:.08;width:230mm;height:230mm;top:60%}
.cover .emb{display:block;width:34mm;height:34mm}.cover .emb svg{width:100%;height:100%;fill:#fff}
.cover .ey{font:600 8pt var(--font);letter-spacing:.2em;text-transform:uppercase;margin-top:14mm;color:#bbb}
.cover h1{font:900 46pt/.95 var(--font);letter-spacing:-.035em;margin-top:5mm}
.cover .krt{font-size:40pt;margin-top:8mm}
.cover .by{font:600 13pt var(--font);margin-top:8mm}
.cover .yr{margin-top:auto;font:800 64pt/1 var(--font);letter-spacing:-.04em}
.cover .rng{font:500 11pt var(--font);color:#bbb;margin-top:3mm}
.cover .foot{border-color:#fff;color:#bbb}

/* how it works */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:8mm;margin-top:3mm}
.lst{list-style:none;padding:0;margin-top:1mm}
.lst li{display:grid;grid-template-columns:16mm 1fr;gap:3mm;padding:1.3mm 0;border-bottom:.2mm solid #ccc;font-size:9pt}
.lst li b{font-weight:700}
.t42{display:grid;grid-template-columns:repeat(7,1fr);gap:1.2mm;margin-top:3mm}
.t42 .h{font:700 8pt var(--font);text-align:center;color:var(--label2);padding-bottom:.5mm}
.t42 .c{background:#f0f0f0;border-radius:1.6mm;padding:1.6mm 1mm 1.4mm;text-align:center;min-height:13.5mm}
.t42 .c i{display:block;font:700 7pt var(--font);font-style:normal;color:var(--label2)}
.t42 .c b{display:block;font:700 7.2pt/1.15 var(--font);margin-top:.6mm;overflow-wrap:anywhere}
.t42 .c small{display:block;font-size:6pt;color:var(--label2);margin-top:.4mm}
.t42 .c.s{background:#000;color:#fff}.t42 .c.s i,.t42 .c.s small{color:#ccc}
.key{display:flex;gap:6mm;font-size:8pt;color:var(--label2);margin-top:3mm;flex-wrap:wrap}

/* seasons */
.ssn{list-style:none;padding:0;margin-top:3mm}
.ssn li{display:grid;grid-template-columns:30mm 1fr;gap:4mm;padding:2mm 0;border-bottom:.2mm solid #ccc;align-items:baseline}
.ssn li b{font:700 9.5pt var(--font)}
.ssn li span{font-size:9pt}
.src{font-size:7.5pt;color:var(--label2);margin-top:4mm}

/* adaduanan pages */
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:8mm}
.hd .kt{font-size:38pt}
.hd .lt{font:800 13pt var(--font);letter-spacing:.06em;margin-top:2mm}
.hd .no{font:800 40pt/1 var(--font);letter-spacing:-.04em;text-align:right}
.hd .no small{display:block;font:600 8pt var(--font);letter-spacing:.1em;text-transform:uppercase;color:var(--label2);margin-top:1mm}
.ban{margin-top:6mm;height:62mm;border-radius:3mm;overflow:hidden;background:#000}
.ban img{width:100%;height:100%;object-fit:cover;display:block}
.mean{margin-top:4mm;font-size:10pt}
.mean b{font-weight:700}
.g{display:grid;grid-template-columns:repeat(7,1fr);gap:1.6mm;margin-top:5mm}
.g .h{font:700 8.5pt var(--font);text-align:center;color:var(--label2)}
.g .c{background:#f0f0f0;border-radius:2mm;padding:2mm 1.2mm 1.6mm;min-height:20mm;display:flex;flex-direction:column;position:relative}
.g .c b{font:800 13pt/1 var(--font)}
.g .c em{font-style:normal;font:600 6.6pt/1.2 var(--font);margin-top:1.4mm;overflow-wrap:anywhere}
.g .c small{font-size:6.4pt;color:var(--label2);margin-top:auto}
.g .c.s{background:#000;color:#fff}.g .c.s small{color:#bbb}
.g .c u{text-decoration:none;font:700 5.6pt var(--font);letter-spacing:.06em;text-transform:uppercase;margin-top:.8mm}
.g .c::after{content:"";position:absolute;right:1.6mm;top:1.8mm;width:1.6mm;height:1.6mm;border-radius:9px}
.g .c.dapaa::after,.key .dapaa{background:currentColor}
.g .c.dabɔne::after,.key .dabɔne{box-shadow:inset 0 0 0 .25mm currentColor}
.g .c.dahunu::after,.key .dahunu{background:#aaa}
.key i{display:inline-block;width:2mm;height:2mm;border-radius:9px;margin-right:1.5mm;vertical-align:middle}

/* closing */
table{width:100%;border-collapse:collapse;margin-top:5mm;font-size:9pt}
th,td{text-align:left;padding:2.2mm 2mm;border-bottom:.2mm solid #bbb}
th{font-size:7.5pt;font-weight:600;color:var(--label2);text-transform:uppercase;letter-spacing:.06em}
td .kr-i{font-size:13pt;margin-right:3mm;vertical-align:middle}
.cta{margin-top:auto;background:#000;color:#fff;border-radius:4mm;padding:10mm;display:flex;justify-content:space-between;align-items:center;gap:8mm}
.cta h2{font-size:20pt}.cta p{color:#ccc;margin-top:2mm}
.cta .url{font:800 22pt var(--font);letter-spacing:-.02em;white-space:nowrap}
.close .foot{margin-top:8mm}
#bar{position:sticky;top:0;z-index:5;background:#000;color:#fff;padding:10px 16px;display:flex;gap:12px;align-items:center;justify-content:center;font:500 14px var(--font)}
#bar button{appearance:none;border:0;border-radius:99px;padding:8px 16px;background:#fff;color:#000;font:600 14px var(--font);cursor:pointer}
@media print{#bar{display:none}}
</style>

 653 468 654 470C655 472 656 475 656 476C656 477 657 479 658 482C659 486 662 502 662 510C662 518 660 523 656 525C654 527 653 527 648 525C646 524 642 523 641 522C640 521 638 520 638 520C637 520 631 516 614 502C600 491 585 480 579 476C578 476 575 474 572 472C562 465 551 460 549 460C549 460 547 459 545 458C543 457 540 456 539 456C538 456 535 455 533 454C531 454 527 453 523 452C515 452 514 453 511 464C509 478 508 486 509 493C511 505 513 516 514 519C515 520 516 522 516 523C516 524 517 526 518 528C521 532 522 537 521 538C519 538 415 539 413 538ZM380 512C373 510 368 503 368 494C368 487 369 485 374 479C381 473 395 473 401 480C404 482 408 492 408 494C408 497 403 506 401 508C396 512 387 514 380 512ZM538 512C535 512 528 505 527 501C523 488 529 477 542 475C563 471 574 498 556 510C553 512 544 514 538 512ZM474 502C475 501 475 499 474 497C473 489 475 459 479 450C483 437 485 434 490 428C496 421 500 420 510 417C515 416 518 416 521 417C524 417 529 418 534 419C542 420 552 423 558 426C566 429 584 438 585 439C586 439 587 440 587 440C587 440 591 442 595 445C605 452 604 448 591 432C572 409 555 396 534 390C522 386 503 389 492 395C490 397 487 399 485 401C472 409 455 407 441 396C439 394 436 392 434 392C432 392 428 390 425 390C413 386 396 389 384 396C381 397 378 399 376 400C365 406 343 428 333 443C329 449 331 449 338 445C347 438 375 424 379 424C380 424 382 423 384 422C386 421 391 420 405 418C409 418 413 417 414 416C417 415 433 420 438 423C448 430 455 445 457 466C458 471 459 478 459 481C460 484 460 488 459 492C458 496 458 498 459 500C460 503 460 503 466 503C471 503 473 503 474 502Z"/></svg>`;
  const WM = `<i class="wm">${EMB}</i>`;
  let p = 1;
  const P = [];
  document.getElementById("bt").textContent = `Afe ${yl} · ${yr.count} adaduanan`;
  document.title = `Afe ${yl} · Akan Adaduanan Calendar · Merankron`;

  // 1. cover
  P.push(`<section class="pg cover">${WM}<i class="emb">${EMB}</i>
    <p class="ey">Following the Asante calendar</p>
    <h1>Akan<br>Adaduanan<br>Calendar</h1>
    <div class="krt">${kr("adaduanan")}</div>
    <p class="by">by Merankron</p>
    <div class="yr">Afe ${yl}</div>
    <p class="rng">${AK.fmtUS(yr.start)} – ${AK.fmtUS(yr.end)} · ${yr.count} adaduanan · ${yr.count * 42} days</p>
    ${foot(p++)}</section>`);

  // 2. how it works
  const STEMS = [["dwoɔ", "Dwoada", "Monday", "Adwo"], ["bena", "Benada", "Tuesday", "Bena"], ["wukuo", "Wukuada", "Wednesday", "Wuku"], ["yaw", "Yawoada", "Thursday", "Yaw"], ["fie", "Fiada", "Friday", "Afi"], ["memene", "Memeneda", "Saturday", "Amen"], ["kwasi", "Kwasiada", "Sunday", "Ayisi"]];
  const PREF = ["fo", "nwona", "nkyi", "kuru", "kwa", "mono"];
  let t42 = AK.DAYS.map(d => `<div class="h">${d[0]}</div>`).join("");
  AK.NNANSON.forEach((N, k) => { const s = AK.SACRED[k + 1]; t42 += `<div class="c${s ? " s" : ""}"><i>${k + 1}</i><b>${N.name}</b><small>${s || N.cat.split("/")[0]}</small></div>`; });
  P.push(`<section class="pg">${WM}${run("How the count works")}
    <h2>Nnawɔtwe and nnanson</h2>
    <p class="lede">The Akan reckon days with two weeks running side by side. Each day takes a prefix from the six-day nnanson and a stem from the seven-day nnawɔtwe. The pair repeats only after 6 × 7 = 42 days: one adaduanan.</p>

        <h3>Four sacred days</h3><ul class="lst">${[1, 10, 19, 28].map(d => `<li><b>Day ${d}</b><span>${AK.SACRED[d]} · ${AK.NNANSON[d - 1].name}</span></li>`).join("")}</ul></div>
    </div>

    ${foot(p++)}</section>`);

  // 3. seasons
  P.push(`<section class="pg">${WM}${run("Adaduanan as seasons")}
    <h2>A farming year in nine names</h2>
    <p class="lede">The adaduanan are more than a count of days. They work like seasons: each name describes the weather and the work of the fields at that time, so the calendar told Akan farmers when to clear, plant, wait and harvest. Read in order, the nine names are an agricultural almanac.</p>
    <ul class="ssn">${AK.CYCLES.map(c => `<li><b>${cap(c.tw)}</b><span>${cap(c.m)}</span></li>`).join("")}</ul>
    <h3>The yam at the centre</h3>
    <p>The year turns on the yam. Mounds are made and planted in oforisuo, the lean weeks of asusuo come before harvest, obubuo is named after the breaking of the withered yam stem, and the afe opens in adɔmmerɛ with Odwira. No one eats the new yam before it is offered to the abosom and the ancestors: “When yam is ready to be harvested, they first give some to the abosom because they protect the state” (Takyiman elders, 1970). Odwira, “to purify”, is a festival of cleansing and renewal timed by that harvest.</p>
    <p>The pattern is not only Akan. The tropical belt of the Gulf of Guinea, from Côte d'Ivoire to Cameroon, grows over 90% of the world's yams, and its peoples mark the new yam in the same way: the Agni and Abron fête des ignames in Côte d'Ivoire, Odwira and the Bono Fofie in Ghana, the Ewe Te Za of Asogli, and the Igbo Iri Ji in Nigeria. Most of them open a new year and offer the first yams to the gods and ancestors before the community eats.</p>
    <p class="src">Seasons after Kwasi Konadu, “The Calendrical Factor in Akan History”, International Journal of African Historical Studies 45:2 (2012), Table 5. Yam production: International Institute of Tropical Agriculture (IITA).</p>
    ${foot(p++)}</section>`);

  // adaduanan pages
  const T = AK.today();
  yr.cycles.forEach(c => {
    let g = AK.DAYS.map(d => `<div class="h">${d[0]}</div>`).join("");
    for (let k = 0; k < 42; k++) {
      const n = c.start + k, N = AK.NNANSON[k], s = AK.SACRED[k + 1];
      g += `<div class="c ${s ? "s" : ""} ${N.cat.split("/")[0]}"><b>${k + 1}</b><em>${N.name}</em>${s && s !== N.name ? `<u>${s}</u>` : ""}<small>${AK.fmt(n)}</small></div>`;
    }
    const img = `cal/print/${c.img}.jpg`;
    P.push(`<section class="pg">${WM}${run("Adaduanan " + (c.i + 1) + " of " + yr.count)}
      <div class="hd"><div><div class="kt">${kr(c.tw)}</div><div class="lt">${c.up}</div></div>
        <div class="no">${c.i + 1}<small>${AK.fmtUS(c.start)} – ${AK.fmtUS(c.end)}</small></div></div>
      <div class="ban"><img src="${img}" alt=""></div>
      <p class="mean"><b>${cap(c.tw)}:</b> ${c.m}</p>
      <div class="g">${g}</div>
      <p class="key"><span><i class="dapaa"></i>dapaa · good</span><span><i class="dabɔne"></i>dabɔne · sacred, restricted</span><span><i class="dahunu"></i>dahunu · ordinary</span></p>
      ${foot(p++)}</section>`);
  });

  // closing
  P.push(`<section class="pg close">${WM}${run("Sacred days")}
    <h2>Sacred days of afe ${yl}</h2>
    <table><thead><tr><th>Adaduanan</th>${[1, 10, 19, 28].map(d => `<th>${AK.SACRED[d]}</th>`).join("")}</tr></thead><tbody>
    ${yr.cycles.map(c => `<tr><td>${kr(c.tw)}${cap(c.tw)}</td>${[1, 10, 19, 28].map(d => `<td>${AK.fmt(c.start + d - 1)}${AK.KESE.has(c.start + d - 1) ? " ✦" : ""}</td>`).join("")}</tr>`).join("")}
    </tbody></table>
    <p class="src">Akwasidae Kɛseɛ (✦) is called by the Asantehene; only recorded dates are marked.</p>
    <div class="cta"><div><h2>Find your Kradin</h2><p>The soul name of any date, the Kɔradin script and the Neo-Akan movement.</p></div><div class="url">neoakan.com</div></div>
    ${foot(p++)}</section>`);

  document.getElementById("doc").innerHTML = P.join("");
  await KF.use("dua"); KF.paint();
  await document.fonts.ready;
  await Promise.all([...document.images].map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })));
  window.AFE_READY = true;
  if (q.get("print")) setTimeout(() => print(), 300);
})();
</script>
</body>
</html>
