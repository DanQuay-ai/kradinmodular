<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Sua · NeoAkan</title>
<meta name="description" content="Learn the Kɔradin script and Twi, one short lesson at a time.">
<style>
@font-face{font-family:"Inter";src:url(fonts/Inter-Regular.woff2) format("woff2");font-weight:400}
@font-face{font-family:"Inter";src:url(fonts/Inter-SemiBold.woff2) format("woff2");font-weight:500 600}
@font-face{font-family:"Inter";src:url(fonts/Inter-Bold.woff2) format("woff2");font-weight:700}
@font-face{font-family:"Inter";src:url(fonts/Inter-ExtraBold.woff2) format("woff2");font-weight:800 900}
:root{--navh:60px;--bg:#fff;--card:#f3f3f3;--label:#000;--label2:#5c5c5c;--label3:#a8a8a8;--sep:#0000001f;--fill:#00000009;--fill2:#00000014;--tint:#000;
  --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;--display:var(--font)}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#111;--label:#fff;--label2:#a3a3a3;--label3:#555;--sep:#ffffff24;--fill:#ffffff0d;--fill2:#ffffff1a;--tint:#fff}}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--label);font:16px/1.5 var(--font);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit}
.kr-i{display:inline-block;font-family:var(--kr),var(--font);font-feature-settings:"liga","calt";line-height:1;white-space:nowrap}
/* neoakan.com nav */
.nn{position:sticky;top:0;z-index:30;height:var(--navh);display:flex;align-items:center;gap:28px;padding:0 28px;background:var(--bg);border-bottom:1px solid var(--sep)}
.nn .logo{font:800 20px/1 var(--font);letter-spacing:-.02em;color:var(--label)}
.nn nav{display:flex;gap:22px;margin-left:auto;align-items:center}
.nn nav a{color:var(--label2);font:500 14px var(--font);transition:color .2s}
.nn nav a:hover,.nn nav a[aria-current]{color:var(--label)}
.nn nav a[aria-current]{text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:1.5px}
.nn .lang{border:1px solid var(--label);border-radius:99px;padding:3px 10px;color:var(--label)!important;font-size:12px!important}
#menu-btn{display:none;margin-left:auto;appearance:none;border:0;background:none;width:40px;height:40px;cursor:pointer;position:relative}
#menu-btn i,#menu-btn i::before,#menu-btn i::after{position:absolute;left:10px;right:10px;height:1.5px;background:var(--label);content:"";transition:transform .25s}
#menu-btn i{top:19px}#menu-btn i::before{left:0;right:0;top:-6px}#menu-btn i::after{left:0;right:0;top:6px}
body.menu-open #menu-btn i{background:transparent}body.menu-open #menu-btn i::before{transform:translateY(6px) rotate(45deg)}body.menu-open #menu-btn i::after{transform:translateY(-6px) rotate(-45deg)}
@media(max-width:900px){
  .nn{padding:0 16px}
  #menu-btn{display:block}
  .nn nav{position:fixed;inset:var(--navh) 0 auto 0;flex-direction:column;align-items:flex-start;gap:0;background:var(--bg);border-bottom:1px solid var(--sep);padding:8px 16px 16px;transform:translateY(-8px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
  .nn nav a{font-size:18px;padding:12px 0;width:100%;border-bottom:1px solid var(--sep)}
  .nn nav a.lang{border:1px solid var(--label);width:auto;margin-top:14px;padding:4px 12px}
  body.menu-open .nn nav{opacity:1;transform:none;pointer-events:auto}
}


#app{max-width:1100px;margin:0 auto;padding:36px 22px 80px}
.ey{font:600 12px var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--label2)}
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.hd h1{font:800 clamp(38px,6vw,68px)/1 var(--font);letter-spacing:-.035em;margin-top:10px}
.stats{display:flex;gap:10px}.stats span{background:var(--card);border-radius:99px;padding:8px 14px;font-size:14px;color:var(--label2)}.stats b{color:var(--label)}
.mods{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:32px}
.mod{background:var(--card);border-radius:22px;padding:24px}
.mh{display:flex;gap:16px;align-items:center}.mh .mk{font-size:40px}.mh h2{font:800 26px var(--font);letter-spacing:-.02em}.mh p{color:var(--label2);font-size:14px;margin-top:2px}
.bar{height:6px;border-radius:9px;background:var(--fill2);overflow:hidden;margin-top:18px}.bar i{display:block;height:100%;background:var(--label);transition:width .4s}
.sm{font-size:13px;color:var(--label2);margin-top:6px}
.opts{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
.sl{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--label2)}
select{border:1px solid var(--sep);border-radius:10px;background:var(--bg);color:var(--label);font:500 14px var(--font);padding:8px 10px}
.tg{display:inline-flex;background:var(--fill2);border-radius:99px;padding:3px}
.tg button{appearance:none;border:0;background:none;border-radius:99px;padding:7px 14px;font:600 13px var(--font);cursor:pointer;color:var(--label2)}
.tg button[aria-pressed=true]{background:var(--label);color:var(--bg)}
.path{list-style:none;padding:0;margin-top:16px;display:flex;flex-direction:column;gap:8px}
.nd{appearance:none;width:100%;display:flex;align-items:center;gap:14px;text-align:left;border:1px solid var(--sep);background:var(--bg);border-radius:14px;padding:10px 14px;cursor:pointer;position:relative;transition:transform .15s}
.nd:hover{transform:translateX(3px)}
.nd .ic{flex:none;width:52px;height:44px;display:grid;place-items:center;border-radius:10px;background:var(--fill2);font-size:22px}
.nd b{display:block;font-weight:700}.nd small{display:block;color:var(--label2);font-size:12px}
.nd.done .ic{background:var(--label);color:var(--bg)}
.nd .ck{margin-left:auto;font-style:normal;font-weight:800}
.nd.lock{opacity:.4;cursor:not-allowed}.nd.lock:hover{transform:none}
.nd.final .ic{background:var(--label);color:var(--bg)}
.shk{animation:shk .35s}@keyframes shk{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.credit{margin-top:28px;font-size:12px;color:var(--label3)}
/* session */
.ses{max-width:640px;margin:0 auto;min-height:calc(100vh - var(--navh) - 120px);display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:14px}.top .bar{flex:1;margin:0}
.x{appearance:none;border:0;background:none;font-size:20px;cursor:pointer;color:var(--label2);width:36px;height:36px}
.q{flex:1;padding:36px 0 24px;text-align:center}
.q h2{font:800 30px var(--font);letter-spacing:-.02em;margin-top:14px}.q h2.snd{font-size:44px}
.hero{margin-top:12px}.xl{font-size:110px}.lg{font-size:44px}.md{font-size:26px}.sm.kr-i{font-size:18px}
.body{color:var(--label2);margin-top:12px;font-size:17px}.body b{color:var(--label)}
.rule{margin:14px auto 0;max-width:460px;background:var(--card);border-radius:12px;padding:10px 14px;font-size:14px}
.kw{display:inline-flex;flex-direction:column;align-items:center;gap:8px;margin-top:20px;padding:14px 22px;border-radius:14px;border:1px solid var(--sep)}.kw>span:last-child{font-size:14px;color:var(--label2)}
.ask{font:700 20px var(--font)}
.big{margin:26px 0}.big .lt.xl{font:800 44px var(--font);letter-spacing:-.02em}
.ops{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:24px}
.op,.mp,.ti{appearance:none;cursor:pointer;border:1.5px solid var(--sep);background:var(--bg);border-radius:14px;padding:16px 12px;font:600 16px var(--font);display:flex;flex-direction:column;align-items:center;gap:6px;transition:border-color .15s,background .15s}
.op:hover,.mp:hover,.ti:hover{border-color:var(--label)}
.op small,.ti small{font-size:12px;color:var(--label2);font-weight:500}
.op.ok,.mp.ok{background:var(--label);color:var(--bg);border-color:var(--label)}.op.ok small{color:var(--bg)}
.op.bad,.mp.bad{border-color:#c62828;background:#c628281a}
.mp.on{border-color:var(--label);background:var(--fill2)}.mp.ok{opacity:.35}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:24px}.mt>div{display:flex;flex-direction:column;gap:10px}
.ln{min-height:64px;border-bottom:2px solid var(--sep);display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:10px 0;margin-top:24px}
.tl{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:20px}.ti{padding:10px 14px}
.wl{list-style:none;padding:0;margin-top:20px;text-align:left}.wl li{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--sep)}.wl li span{color:var(--label2)}.wl small{display:block;font-size:12px;color:var(--label2);margin-top:4px}
.ft{position:sticky;bottom:0;background:var(--bg);padding:14px 0 18px}
.go{appearance:none;border:0;width:100%;padding:16px;border-radius:14px;background:var(--label);color:var(--bg);font:700 16px var(--font);cursor:pointer}.go:disabled{opacity:.3;cursor:default}
.fb{display:flex;flex-direction:column;gap:12px;border-radius:16px;padding:16px;text-align:left}.fb.y{background:var(--card)}.fb.n{background:#c6282814}
.fb b{display:block;font-size:18px}.fb span{color:var(--label2)}
@media(max-width:800px){.mods{grid-template-columns:1fr}#app{padding:24px 16px 64px}.xl{font-size:84px}}
</style>
</head>
<body>
<header class="nn">
  <a class="logo" href="https://neoakan.com/">NeoAkan</a>
  <button id="menu-btn" aria-label="Menu"><i></i></button>
  <nav aria-label="Main">
    <a href="https://neoakan.com/#about">Yɛn ho nsɛm</a>
    <a href="https://neoakan.com/#archetypes">Archetypes</a>
    <a href="https://neoakan.com/#merankron">Merankron</a>
    <a href="https://neoakan.com/showcase">Exhibition</a>
    <a href="https://neoakan.com/directory">Index</a>
    <a href="https://neoakan.com/kradin">Kradin</a>
    <a href="https://neoakan.com/articles" aria-current="page">Articles</a>
    <a class="lang" href="#" lang="fr">FR</a>
  </nav>
</header>
<main id="app"></main>
<script src="twi.js"></script>
<script src="kfont.js"></script>
<script src="mnemonics.js"></script>
<script src="learn-data.js"></script>
<script src="learn.js"></script>
<script>document.getElementById("menu-btn").onclick=()=>document.body.classList.toggle("menu-open")</script>
</body>
</html>
