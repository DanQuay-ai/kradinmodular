<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title data-fr-title="Sua · NeoAkan">Sua · NeoAkan</title>
<meta name="description" content="Learn the Kɔradin script and Twi, one short lesson at a time.">
<style>
@font-face{font-family:"Inter";src:url(fonts/Inter-Regular.woff2) format("woff2");font-weight:400}
@font-face{font-family:"Inter";src:url(fonts/Inter-SemiBold.woff2) format("woff2");font-weight:500 600}
@font-face{font-family:"Inter";src:url(fonts/Inter-Bold.woff2) format("woff2");font-weight:700}
@font-face{font-family:"Inter";src:url(fonts/Inter-ExtraBold.woff2) format("woff2");font-weight:800 900}
:root{--navh:60px;--bg:#fff;--card:#f3f3f3;--label:#000;--label2:#5c5c5c;--label3:#a8a8a8;--sep:#0000001f;--fill:#00000009;--fill2:#00000014;--tint:#000;
  --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;--display:var(--font)}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#111;--label:#fff;--label2:#a3a3a3;--label3:#555;--sep:#ffffff24;--fill:#ffffff0d;--fill2:#ffffff1a;--tint:#fff}}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--label);font:16px/1.5 var(--font);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit}
.kr-i{display:inline-block;font-family:var(--kr),var(--font);font-feature-settings:"liga","calt";line-height:1;white-space:nowrap}
/* neoakan.com nav */
.nn{position:sticky;top:0;z-index:30;height:var(--navh);display:flex;align-items:center;gap:28px;padding:0 28px;background:var(--bg);border-bottom:1px solid var(--sep)}
.nn .logo{font:800 20px/1 var(--font);letter-spacing:-.02em;color:var(--label)}
.nn nav{display:flex;gap:22px;margin-left:auto;align-items:center}
.nn nav a{color:var(--label2);font:500 14px var(--font);transition:color .2s}
.nn nav a:hover,.nn nav a[aria-current]{color:var(--label)}
.nn nav a[aria-current]{text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:1.5px}
.nn .lang{border:1px solid var(--label);border-radius:99px;padding:3px 10px;color:var(--label)!important;font-size:12px!important}
#menu-btn{display:none;margin-left:auto;appearance:none;border:0;background:none;width:40px;height:40px;cursor:pointer;position:relative}
#menu-btn i,#menu-btn i::before,#menu-btn i::after{position:absolute;left:10px;right:10px;height:1.5px;background:var(--label);content:"";transition:transform .25s}
#menu-btn i{top:19px}#menu-btn i::before{left:0;right:0;top:-6px}#menu-btn i::after{left:0;right:0;top:6px}
body.menu-open #menu-btn i{background:transparent}body.menu-open #menu-btn i::before{transform:translateY(6px) rotate(45deg)}body.menu-open #menu-btn i::after{transform:translateY(-6px) rotate(-45deg)}
@media(max-width:900px){
  .nn{padding:0 16px}
  #menu-btn{display:block}
  .nn nav{position:fixed;inset:var(--navh) 0 auto 0;flex-direction:column;align-items:flex-start;gap:0;background:var(--bg);border-bottom:1px solid var(--sep);padding:8px 16px 16px;transform:translateY(-8px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
  .nn nav a{font-size:18px;padding:12px 0;width:100%;border-bottom:1px solid var(--sep)}
  .nn nav a.lang{border:1px solid var(--label);width:auto;margin-top:14px;padding:4px 12px}
  body.menu-open .nn nav{opacity:1;transform:none;pointer-events:auto}
}


#app{max-width:1100px;margin:0 auto;padding:36px 22px 80px}
html,body{overflow-x:hidden}
:root{--ok:#1fa35b;--ok-bg:#1fa35b1f;--bad:#f2b705;--bad-bg:#f2b7052e;--bad-ink:#7a5a00;--hl:#f2b705}
@media (prefers-color-scheme:dark){:root{--ok:#34c472;--ok-bg:#34c4722b;--bad:#ffc928;--bad-bg:#ffc92826;--bad-ink:#ffd760}}
.ico{display:inline-block;vertical-align:middle;flex:none}
.ico.num{width:var(--s);height:var(--s);display:inline-grid;place-items:center;border:1.6px solid currentColor;border-radius:28%;font:800 calc(var(--s)*.45)/1 var(--font)}
.ey{font:600 12px var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--label2)}
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.hd h1{font:800 clamp(36px,6vw,68px)/1 var(--font);letter-spacing:-.035em;margin-top:10px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.st{display:inline-flex;align-items:center;gap:6px;background:var(--card);border-radius:99px;padding:8px 14px;font-size:14px;color:var(--label2);border:0}
.st b{color:var(--label)}
.st.fl.on .ico{color:#ff7a00;animation:flick 1.6s ease-in-out infinite;transform-origin:50% 90%}
.st.cw .ico{color:#c9a227}
.mt{cursor:pointer;padding:8px 10px}
@keyframes flick{0%,100%{transform:scale(1) rotate(0)}30%{transform:scale(1.12,.94) rotate(-4deg)}60%{transform:scale(.95,1.08) rotate(3deg)}}
.mods{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;margin-top:32px}
.mod{background:var(--card);border-radius:22px;padding:24px;min-width:0}
.mh{display:flex;gap:16px;align-items:center}.mh .mk{font-size:40px}.mh h2{font:800 26px var(--font);letter-spacing:-.02em}.mh p{color:var(--label2);font-size:14px;margin-top:2px}
.bar{height:8px;border-radius:9px;background:var(--fill2);overflow:hidden;margin-top:18px}.bar i{display:block;height:100%;background:var(--ok);border-radius:9px;transition:width .5s cubic-bezier(.3,1.4,.5,1)}
.sm{font-size:13px;color:var(--label2);margin-top:6px}
.opts{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
.sl{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--label2)}
select{border:1px solid var(--sep);border-radius:10px;background:var(--bg);color:var(--label);font:500 14px var(--font);padding:8px 10px;max-width:100%}
.tg{display:inline-flex;background:var(--fill2);border-radius:99px;padding:3px}
.tg button{appearance:none;border:0;background:none;border-radius:99px;padding:7px 14px;font:600 13px var(--font);cursor:pointer;color:var(--label2);transition:background .2s,color .2s}
.tg button[aria-pressed=true]{background:var(--label);color:var(--bg)}
.path{list-style:none;padding:0;margin-top:16px;display:flex;flex-direction:column;gap:8px}
.nd{appearance:none;width:100%;display:flex;align-items:center;gap:14px;text-align:left;border:1px solid var(--sep);background:var(--bg);border-radius:14px;padding:10px 14px;cursor:pointer;position:relative;transition:transform .18s cubic-bezier(.3,1.5,.5,1),box-shadow .18s;box-shadow:0 3px 0 var(--sep)}
.nd:hover{transform:translateY(-2px)}.nd:active{transform:translateY(2px);box-shadow:0 1px 0 var(--sep)}
.nd .ic{flex:none;width:52px;height:44px;display:grid;place-items:center;border-radius:10px;background:var(--fill2);font-size:22px}
.nd b{display:block;font-weight:700}.nd small{display:block;color:var(--label2);font-size:12px}
.nd>span:nth-child(2){min-width:0}
.nd.done .ic{background:var(--ok);color:#fff}
.nd .ck{margin-left:auto;font-style:normal;color:var(--label2)}.nd.done .ck{color:var(--ok)}
.nd.lock{opacity:.45;cursor:not-allowed}.nd.lock:hover{transform:none}
.nd.final .ic{background:var(--hl);color:#000}
/* motion */
.rise{animation:rise .45s cubic-bezier(.2,1.2,.4,1) both;animation-delay:var(--d,0s)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{opacity:0;transform:scale(.6)}}
.in{animation:slide .35s cubic-bezier(.2,1,.4,1) both}
@keyframes slide{from{opacity:0;transform:translateX(28px)}}
.shk{animation:shk .42s cubic-bezier(.36,.07,.19,.97)}
@keyframes shk{15%,85%{transform:translateX(-3px)}30%,70%{transform:translateX(6px)}45%,55%{transform:translateX(-8px)}}
.bounce{animation:bounce .45s cubic-bezier(.2,1.8,.4,1)}
@keyframes bounce{40%{transform:scale(1.08)}}
.up{animation:up .3s cubic-bezier(.2,1.2,.4,1) both}@keyframes up{from{transform:translateY(100%);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* session */
.ses{max-width:640px;margin:0 auto;min-height:calc(100dvh - var(--navh) - 100px);display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px}.top .bar{flex:1;margin:0;height:14px}
.mini{display:inline-flex;align-items:center;gap:4px;font:700 14px var(--font)}.mini .ico{color:#c9a227}
.x{appearance:none;border:0;background:none;font-size:20px;cursor:pointer;color:var(--label2);width:36px;height:36px}
.q{flex:1;padding:30px 0 20px;text-align:center;min-width:0}
.q h2{font:800 30px var(--font);letter-spacing:-.02em;margin-top:14px}.q h2.snd{font-size:46px}
.hero{margin-top:12px;display:flex;justify-content:center;align-items:center;gap:14px}
.xl{font-size:110px}.lg{font-size:44px}.md{font-size:26px}.sm.kr-i,.krw.sm{font-size:20px}
.hlg{color:var(--label);text-shadow:0 0 0 var(--hl)}
.der{display:inline-flex;align-items:center;gap:10px;color:var(--label3)}.der i{font-style:normal;font-size:28px}
.dim{opacity:.45}
.body{color:var(--label2);margin-top:12px;font-size:17px}.body b{color:var(--label)}
.rule{margin:14px auto 0;max-width:460px;background:var(--card);border-radius:12px;padding:10px 14px;font-size:14px;border-left:4px solid var(--hl);text-align:left}
.kw{display:inline-flex;flex-direction:column;align-items:center;gap:10px;margin-top:20px;padding:16px 22px;border-radius:16px;border:1px solid var(--sep);max-width:100%}.kw>span:last-child{font-size:14px;color:var(--label2)}
.krw{display:inline-flex;flex-wrap:wrap;justify-content:center;gap:0 .35em;max-width:100%;line-height:1.1}
.krw .wd{display:inline-flex}
.sy{border-radius:.12em;padding:0 .02em;transition:background .2s,color .2s}
.sy.hl{background:var(--hl);color:#000;box-shadow:0 0 0 .06em var(--hl)}
.tapw .sy{cursor:pointer;padding:0 .06em}.tapw .sy:hover{background:var(--fill2)}
.sy.okc{background:var(--ok);color:#fff}.sy.badc{background:var(--bad);color:#000;animation:shk .4s}
.ask{font:700 20px var(--font)}.ag{font-style:normal;font-size:12px;font-weight:700;background:var(--bad-bg);color:var(--bad-ink);padding:2px 8px;border-radius:99px;vertical-align:middle}
.big{margin:26px 0;max-width:100%;overflow-wrap:anywhere}.big .lt{font:800 clamp(30px,8vw,44px)/1.1 var(--font);letter-spacing:-.02em}
.pi{margin-top:18px;color:var(--label)}
.ops{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:24px}
.op,.mp,.ti{appearance:none;cursor:pointer;border:2px solid var(--sep);background:var(--bg);border-radius:14px;padding:16px 12px;font:600 16px var(--font);display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;overflow-wrap:anywhere;box-shadow:0 3px 0 var(--sep);transition:border-color .15s,background .15s,transform .1s}
.op:hover,.mp:hover,.ti:hover{border-color:var(--label2)}
.op:active,.mp:active,.ti:active{transform:translateY(2px);box-shadow:0 1px 0 var(--sep)}
.op small,.ti small{font-size:12px;color:var(--label2);font-weight:500}
.op.ok,.mp.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);box-shadow:0 3px 0 var(--ok)}
.op.bad,.mp.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad-ink);box-shadow:0 3px 0 var(--bad)}
.mp.on{border-color:var(--label);background:var(--fill2)}.mp.ok{opacity:.55}
.pics .op{padding:18px 8px}.pics .op .ico{color:var(--label)}
.mt{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:24px}.mt>div{display:flex;flex-direction:column;gap:10px;min-width:0}
.ln{min-height:68px;border-bottom:2px solid var(--sep);display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:10px 0;margin-top:24px}
.tl{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:20px}.ti{padding:10px 14px}
.wl{list-style:none;padding:0;margin-top:20px;text-align:left}.wl li{display:grid;grid-template-columns:34px minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--sep)}.wl .gl{color:var(--label2)}.wl small{display:block;font-size:12px;color:var(--label2);margin-top:4px}.wi{color:var(--label2)}
.ft{position:sticky;bottom:0;background:var(--bg);padding:14px 0 calc(18px + env(safe-area-inset-bottom))}
.go{appearance:none;border:0;width:100%;padding:16px;border-radius:14px;background:var(--label);color:var(--bg);font:800 16px var(--font);letter-spacing:.02em;cursor:pointer;box-shadow:0 4px 0 var(--label3);transition:transform .1s}.go:active{transform:translateY(3px);box-shadow:0 1px 0 var(--label3)}.go:disabled{opacity:.3;cursor:default}
.fb{display:flex;flex-direction:column;gap:12px;border-radius:16px;padding:16px;text-align:left}
.fbt{display:flex;gap:12px;align-items:flex-start}.fbi{flex:none;width:36px;height:36px;border-radius:99px;display:grid;place-items:center;color:#fff}
.fb.y{background:var(--ok-bg)}.fb.y b{color:var(--ok)}.fb.y .fbi{background:var(--ok)}.fb.y .go{background:var(--ok);color:#fff;box-shadow:0 4px 0 #157a43}
.fb.n{background:var(--bad-bg)}.fb.n b{color:var(--bad-ink)}.fb.n .fbi{background:var(--bad);color:#000}.fb.n .go{background:var(--bad);color:#000;box-shadow:0 4px 0 #b88900}
.fb b{display:block;font-size:20px}.fb p{color:var(--label);margin-top:4px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.wins{display:flex;gap:10px;justify-content:center;margin-top:18px}.wins .st{font-size:18px;padding:10px 18px}
.confetti{position:fixed;left:50%;top:40%;pointer-events:none;z-index:40}
.confetti i{position:absolute;color:#c9a227;animation:boom 1.3s cubic-bezier(.1,.8,.3,1) forwards;animation-delay:var(--d);opacity:0}
@keyframes boom{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--x),55vh) rotate(var(--r))}}
@media(max-width:800px){.mods{grid-template-columns:minmax(0,1fr)}#app{padding:24px 16px 64px}.xl{font-size:84px}.lg{font-size:36px}.mod{padding:18px}.hd{align-items:flex-start}}
</style>
</head>

  <a class="logo" href="https://neoakan.com/">NeoAkan</a>

    <a class="lang" href="#" id="langbtn"></a>
  </nav>
</header>
<main id="app"></main>
<script src="nav.js"></script>
<script src="twi.js"></script>
<script src="kfont.js"></script>
<script src="icons.js"></script>
<script src="mnemonics.js"></script>
<script src="learn-data.js"></script>
<script src="learn.js"></script>
</body>
</html>
