// spiral from centre C, radius r, start angle th (deg), n half-turns (fractional ok), ccw true = anticlockwise
function spiralFrom(cx,cy,r,th,n,ccw,p){p=p??W+GAP();let d="",t=th*Math.PI/180,s=ccw?1:-1;
  while(n>0&&r>0.6*W){const k=Math.min(1,n),ta=t+s*k*Math.PI,ex=cx+r*Math.cos(ta),ey=cy+r*Math.sin(ta);
    d+=` A${f(r)},${f(r)} 0 0 ${ccw?1:0} ${f(ex)},${f(ey)}`;if(k<1)break;
    const r2=r-p/2;cx=ex+(cx-ex)*r2/r;cy=ey+(cy-ey)*r2/r;r=r2;t=ta;n-=1}return d}
